# Continuous integration on the private Gitea (stage 15). The runner is the build Mac in host mode
# (label macos-arm64, setup in docs/RELEASING.md, "CI"). Every push to main and every pull request
# runs scripts/check.sh; tags and a manual start also build both installers, unsigned and without
# update signature, as artifacts of the run. Releases stay a manual step (docs/RELEASING.md).
#
# Build output and the Windows SDK for cargo-xwin live outside the fresh checkout, under
# ~/.cache/vice-mail-ci on the runner, so a run does not start from nothing.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Runner cache
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/vice-mail-ci/target" >> "$GITHUB_ENV"
          echo "XWIN_CACHE_DIR=$HOME/.cache/vice-mail-ci/xwin" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          cargo --version
          node --version
          pnpm --version
      - name: Frontend dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: scripts/check.sh
        run: scripts/check.sh

  installers:
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Runner cache
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/vice-mail-ci/target" >> "$GITHUB_ENV"
          echo "XWIN_CACHE_DIR=$HOME/.cache/vice-mail-ci/xwin" >> "$GITHUB_ENV"
      - name: Frontend dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Windows installer
        run: scripts/build-windows.sh
      - name: macOS disk image
        # Ad hoc signed even if the runner's keychain holds a Developer ID: CI never notarises.
        # The start test needs a GUI session, which a background runner does not have.
        env:
          VICEMAIL_SIGNING_IDENTITY: "-"
          SKIP_LAUNCH_CHECK: "1"
        run: scripts/build-macos.sh
      - name: Collect
        run: |
          mkdir -p ci-out
          cp "$CARGO_TARGET_DIR"/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe ci-out/
          cp "$CARGO_TARGET_DIR"/release/bundle/dmg/*.dmg ci-out/
          (cd ci-out && shasum -a 256 * > SHA256SUMS)
          cat ci-out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: ci-out/
          retention-days: 14
