[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
# Stage 0 spikes are throwaway code with their own manifests; never part of the product build.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# mail-parser 1.0 declares rust-version 1.98 (Tauri 2.12 needs 1.90). See decision 0006.
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Own crates
mail-model = { path = "crates/mail-model" }
mail-store = { path = "crates/mail-store" }
mail-engine = { path = "crates/mail-engine" }
mail-imap = { path = "crates/mail-imap" }
mail-content = { path = "crates/mail-content" }
# Stage 12: the MCP host and its tools (decision 0015); the shell links its helper as a sidecar.
mail-mcp = { path = "crates/mail-mcp" }
# Windows only: the one crate with `unsafe` (WebView2 COM calls, decision 0011).
webview2-guard = { path = "crates/webview2-guard" }

# Core
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry", "ansi"] }
tracing-appender = "0.2.5"

# Database. rusqlite 0.41 (not 0.43) because rusqlite_migration 2.7.0 requires rusqlite ^0.41
# and two rusqlite versions cannot coexist (both link the native `sqlite3`).
rusqlite = { version = "0.41.1", features = ["bundled"] }
rusqlite_migration = "2.7.0"

# Message bodies (stage 3, decision 0009): zstd level 3 with checksum, one file per fetch under
# <data dir>/bodies. The C library is built by the cc crate (also with cargo-xwin for Windows);
# without default features: no legacy formats, no dictionary builder.
zstd = { version = "0.14.4", default-features = false }

# Account ids (UUID v4). mail-model only parses and formats; mail-engine adds the `v4` feature.
uuid = { version = "1.29.3", default-features = false, features = ["std", "serde"] }
# The user's time zone for search dates (stage 7): the system zone and the system's tzdb
# (bundled on Windows, which has none in TZif form). MIT OR Unlicense.
jiff = { version = "1.0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }

# IPC types (decision 0004): exact pins, release candidates.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

# Shell
tauri = { version = "2.12.7", features = [] }
tauri-build = { version = "2.7.6", features = [] }
# Stage 9 (decision 0020): native notifications from Rust only (no frontend permission); clicks
# come back through the plugin's action handler. Windows only: one running instance, so a
# `mailto:` link opened while the app runs reaches it (and no second process opens the
# database).
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"

# TLS (decision 0002): rustls with the `aws-lc-rs` provider (chosen in `mail_imap::tls`, nowhere
# else), certificates checked by the system. aws-lc-sys builds with `cc` and, on Windows without
# NASM, links the pre-assembled objects it ships (`prebuilt-nasm`): no CMake, NASM or Go.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }

# IMAP (decision 0002): async-imap on Tokio; mail-parser decodes RFC 2047 words, charsets and
# dates of header data (stage 2) and whole messages (stage 3). mail-parser 1.0 needs Rust 1.98.
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
mail-parser = { version = "1.0.1", features = ["full_encoding"] }

# Message content (stage 3, crate mail-content): ammonia sanitises mail HTML (decision 0005);
# html5ever and cssparser are the parser and CSS tokenizer ammonia (and wry) already use; url
# parses link targets; ICU4X (already in the tree via idna) gives NFC and the Script property.
ammonia = "4.2.5"
html5ever = "0.40.1"
cssparser = { version = "0.38.0", default-features = false }
url = "2.5.9"
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.4.0", default-features = false, features = ["compiled_data"] }

# Sending (stage 5). mail-builder writes the MIME message in mail-content; without default
# features, so it never reads the host name (it would go into generated Message-IDs; we always
# set our own). lettre only as the SMTP protocol layer (EHLO, AUTH, MAIL/RCPT/DATA, replies,
# dot-stuffing) over the adapter's own TCP/TLS streams: no TLS backend of its own (rustls is set
# up in mail-imap as for IMAP), no host name (EHLO sends an address literal), no `tracing`
# (it would log AUTH lines and message data), no pool, no builder.
mail-builder = { version = "2.0.1", default-features = false }
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "tokio1"] }

# Keychain (stage 2): keyring-core with the two native stores, chosen explicitly (no global
# default store, no Linux D-Bus stack). The `keyring` crate's own README recommends this for apps.
keyring-core = "1.1.0"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

# Server discovery (stage 2): DNS SRV with the system's DNS servers, HTTPS for autoconfig.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
# HTTP/1.1 only, no cookies, no proxy, no compression; TLS config comes from our rustls setup.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
roxmltree = "0.21.2"

# Stage 3: opening links and attachments with the system's default app (macOS `open`, Windows
# `ShellExecuteW` instead of `cmd /c start`, which re-parses `&` and `^` in URLs), and the save
# dialog. rfd directly instead of tauri-plugin-dialog: the plugin injects a script into the page
# (window.alert/confirm over IPC) and needs tauri-plugin-fs; neither is wanted.
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
rfd = { version = "0.18.0", default-features = false }

# Settings sync (stage 11, docs/SYNC.md): age encrypts every record to a random X25519 key that is
# itself wrapped with the passphrase (scrypt recipient). HMAC-SHA-256 (RustCrypto) derives the
# opaque record ids the mail server sees; sha2 0.11 and digest 0.11 are in the tree already.
# age 0.11.5 (14.07.2026, maintained next to 0.12) instead of 0.12.1: 0.12 always pulls in P-256
# for its `tag` recipients, and that tree has RUSTSEC-2026-0387 (crypto-bigint 0.5.5), which fails
# `cargo deny`. Same file format; only X25519 and scrypt recipients are used.
age = "0.11.5"
hmac = "0.13.0"
sha2 = "0.11.1"

# MCP server (stage 12, decision 0015). The helper `mail-mcp` and the host in the app speak MCP
# (JSON-RPC lines) themselves; the client handshake is HMAC-SHA-256 (hmac/sha2 above) over random
# nonces from getrandom 0.4 (already in the tree through uuid). rmcp, the official Rust SDK, only
# as the MCP client of the contract tests (both protocol eras), never in the shipped binary.
getrandom = "0.4.3"
rmcp = { version = "3.11.0", default-features = false, features = ["client", "transport-async-rw"] }

# Tests
tempfile = "3.27.0"
# Test certificates generated at test time (no key material in the repository), with the app's
# crypto provider; rcgen's default would pull `ring` back in.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# mail-content tests: the DOM html5ever's own conformance tests use, to re-parse sanitised
# output independently of the crate's DOM (test-only, as its "+unofficial" version says).
markup5ever_rcdom = "0.40.1"

# Desktop tests (decision 0005): only in test builds of mail-app (`--features e2e`), never shipped.
tauri-plugin-wdio-webdriver = "=1.5.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Shipped builds (decision 0004): fat LTO, one codegen unit, stripped. Daily work uses debug builds.
[profile.release]
codegen-units = 1
lto = true
strip = true

# Keep `target/` small: no debug info for dependencies, full debug info for our own crates.
[profile.dev.package."*"]
debug = false
