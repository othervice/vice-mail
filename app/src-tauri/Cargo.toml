[package]
name = "mail-app"
description = "Desktop shell: window, commands and wiring around mail-engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mail_app"
path = "src/lib.rs"

[[bin]]
name = "mail-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mail-model.workspace = true
mail-engine.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# Test builds only (feature `e2e`): embedded W3C WebDriver for WebdriverIO.
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Test builds only (feature `e2e`): reads the native window buttons for the desktop test.
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
# WebView2 frame guard (feature `webview2-frame-guard`, decision 0011): the one crate with
# `unsafe`; this crate itself keeps `forbid`.
webview2-guard = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Save dialog for attachments (stage 3), from Rust only; the frontend gets no dialog access.
rfd.workspace = true

[features]
default = ["webview2-frame-guard"]
# Desktop-test build (`pnpm --dir app build:e2e`): embedded WebDriver, a data directory of the
# test's own and the `e2e_*` test commands. Never part of a shipped build (`test:release-clean`).
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:objc2", "dep:objc2-app-kit"]
# Windows: checks navigations inside the mail frame through WebView2's FrameNavigationStarting
# (crate webview2-guard, decision 0011). On by default; without it links in HTML mail do nothing
# under Windows (the frame only knows placeholders, so no real target leaks either way).
webview2-frame-guard = ["dep:webview2-guard"]

[dev-dependencies]
serde_json.workspace = true
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
