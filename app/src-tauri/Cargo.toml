[package]
name = "mail-app"
description = "Desktop shell: window, commands and wiring around mail-engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mail_app"
path = "src/lib.rs"

[[bin]]
name = "mail-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mail-model.workspace = true
mail-engine.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tokio = { workspace = true, features = ["sync", "time", "process"] }
tracing.workspace = true
# Test builds only (feature `e2e`): embedded W3C WebDriver for WebdriverIO.
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
# Stage 9: native notifications, used from Rust only (decision 0020).
tauri-plugin-notification.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Test builds only (feature `e2e`): reads the native window buttons for the desktop test and
# sends it real mouse clicks (NSEvent).
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSGraphicsContext",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { workspace = true, optional = true, features = [
    "std",
    "objc2-core-foundation",
    "NSDate",
    "NSGeometry",
    "NSProcessInfo",
] }

[target.'cfg(windows)'.dependencies]
# Stage 9: a second start (a `mailto:` link) hands its arguments to the running app; the
# Settings app opens for "set as default" (the core's opener crate).
tauri-plugin-single-instance.workspace = true
open.workspace = true
# WebView2 frame guard (feature `webview2-frame-guard`, decision 0011): the one crate with
# `unsafe`; this crate itself keeps `forbid`.
webview2-guard = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Save dialog for attachments (stage 3), from Rust only; the frontend gets no dialog access.
rfd.workspace = true

[features]
default = ["webview2-frame-guard"]
# Desktop-test build (`pnpm --dir app build:e2e`): embedded WebDriver, a data directory of the
# test's own and the `e2e_*` test commands. Never part of a shipped build (`test:release-clean`).
e2e = [
    "dep:tauri-plugin-wdio-webdriver",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]
# Windows: checks navigations inside the mail frame through WebView2's FrameNavigationStarting
# (crate webview2-guard, decision 0011). On by default; without it links in HTML mail do nothing
# under Windows (the frame only knows placeholders, so no real target leaks either way).
webview2-frame-guard = ["dep:webview2-guard"]

[dev-dependencies]
# Seeds a database for the command tests of stage 4 (an account with a message, no server).
mail-store.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
