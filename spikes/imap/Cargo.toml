[package]
name = "imap-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Stage 0 spike A: async-imap with Tokio and rustls against the local test server (throwaway code)"

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-platform-verifier = "0.7.1"
futures = "0.3.34"
anyhow = "1.0.104"
thiserror = "2"
lettre = { version = "0.11.24", default-features = false, features = ["tokio1-rustls", "ring", "rustls-platform-verifier", "smtp-transport", "builder", "hostname"] }
libc = "0.2"

[profile.release]
debug = false
