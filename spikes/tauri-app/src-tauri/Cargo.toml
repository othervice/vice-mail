[package]
name = "vice-mail-spike"
version = "0.1.0"
description = "Stage 0 spike C: Tauri 2 + React, typed IPC, Windows cross-build"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "vice_mail_spike"
path = "src/lib.rs"

[[bin]]
name = "vice-mail-spike"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }

# Candidate 1: tauri-specta (commands + events + types)
specta = { version = "=2.0.0-rc.28", features = ["derive", "chrono"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

# Candidate 2: ts-rs (types only)
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
