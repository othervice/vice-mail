# cargo-deny: licences, security advisories, banned crates and allowed sources.
# Run with `cargo deny check` (part of scripts/check.sh).

[graph]
# The platforms we ship. Linux-only dependencies (GTK stack) are not part of the product.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Every vulnerability and unmaintained/unsound notice fails the check; any exception goes into
# `ignore` with the advisory id and a reason.
yanked = "deny"
ignore = []

[licenses]
# Allowlist: only licences compatible with GPL-3.0-or-later, and only those the dependency
# graph actually needs (crates licensed "MIT OR …" are covered by MIT).
allow = [
    "MIT",
    "Apache-2.0",   # GPL-3.0 compatible (not GPL-2.0-only); e.g. rusqlite_migration
    "BSD-2-Clause", # Inflector (via specta)
    "BSD-3-Clause", # brotli, alloc-no-stdlib (via tauri)
    "MPL-2.0",      # cssparser, selectors, option-ext (via tauri); file-level copyleft, GPL compatible
    "Unicode-3.0",  # ICU data and unicode-ident (via url/idna)
    "Zlib",         # foldhash (via hashbrown)
    "ISC",          # ring, rustls-webpki, untrusted (rustls stack); GPL-3.0 compatible, see decision 0002
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
# Our own crates are `publish = false` and GPL-3.0-or-later; they are not dependencies.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS goes through rustls (docs/ARCHITECTURE.md). No OpenSSL or native-tls anywhere.
    { crate = "openssl", reason = "TLS via rustls only" },
    { crate = "openssl-sys", reason = "TLS via rustls only" },
    { crate = "native-tls", reason = "TLS via rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
