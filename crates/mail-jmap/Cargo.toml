[package]
name = "mail-jmap"
description = "JMAP adapter (RFC 8620, RFC 8621): implements MailConnector, MailBackend, MailWriter and MailSender over HTTPS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Records the methods connections send (`MethodLog`), for the engine's server tests. Never
# enabled in the product.
test-support = []

[dependencies]
mail-model.workspace = true
# HTTP/1.1 without proxy, cookies or compression; the TLS configuration comes from the engine
# (`mail_imap::tls`, one place for provider and verifier).
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing.workspace = true
url.workspace = true
# Dates (RFC 3339) and message ids of header values, as in the IMAP adapter.
mail-parser.workspace = true

[dev-dependencies]
mail-jmap = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
# The category header list is the classifier's (a test keeps both equal).
mail-content.workspace = true
# Server tests: the test server's settings, its CA and the app's TLS configuration.
mail-imap = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
