[package]
name = "mail-engine"
description = "Core of the mail client: the AppCore facade, the typed event stream and logging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mail-model.workspace = true
mail-store.workspace = true
mail-imap.workspace = true
# Parsing, sanitising, link checks and file names of message content (stage 3).
mail-content.workspace = true
# Account ids (UUID v4).
uuid = { workspace = true, features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
# `net` for the resolver of external images (`lookup_host`).
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# Keychain (credentials.rs)
keyring-core.workspace = true
# Server discovery (discovery/)
hickory-resolver.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
# Host checks of external images (stage 3).
url.workspace = true
# Opening links and attachments with the system's default apps (stage 3).
open.workspace = true
# Settings sync (settings_sync/): encryption, opaque record ids, typed errors.
age.workspace = true
hmac.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[dev-dependencies]
# Test server helpers (TestEnv, Proxy, WireTap, send_mail) for the server tests.
mail-imap = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# Local HTTPS and DNS servers in the discovery tests.
rcgen.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
