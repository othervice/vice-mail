[package]
name = "mail-mcp"
description = "Local MCP server: the helper program AI clients start, and the host inside the app it talks to."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mail-mcp"
path = "src/main.rs"

[dependencies]
mail-model.workspace = true
mail-content.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "io-std", "net", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true

[dev-dependencies]
rmcp.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "process"] }
uuid.workspace = true

[lints]
workspace = true
